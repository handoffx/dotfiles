# Catppuccin Mocha capsule status line, hand-written (no plugin manager).
# Two-tone capsules: colored icon segment + surface0 text segment, rounded ends,
# on a transparent bar. Palette: https://catppuccin.com/palette
# Separators: U+E0B6 (left) / U+E0B4 (right), Nerd Font required.

set -g status-position bottom
set -g status-justify left
set -g status-style "bg=default,fg=#cdd6f4"
set -g status-interval 15
set -g status-left-length 40
set -g status-right-length 120

# Capsules referenced from conditionals via #{E:...} so their commas need no escaping
set -g @cap_zoom "#[fg=#f9e2af,bg=default]#[fg=#11111b,bg=#f9e2af] #[fg=#cdd6f4,bg=#313244] ZOOM #[fg=#313244,bg=default,nobold] "
set -g @cap_sync "#[fg=#f9e2af,bg=default]#[fg=#11111b,bg=#f9e2af] #[fg=#cdd6f4,bg=#313244] SYNC #[fg=#313244,bg=default,nobold] "
set -g @cap_copy "#[fg=#f9e2af,bg=default]#[fg=#11111b,bg=#f9e2af] #[fg=#cdd6f4,bg=#313244] COPY #[fg=#313244,bg=default,nobold] "

# Session; the icon segment turns red while the prefix is pending
set -g status-left "#[fg=#{?client_prefix,#f38ba8,#89b4fa},bg=default]#[fg=#11111b,bg=#{?client_prefix,#f38ba8,#89b4fa}] #[fg=#cdd6f4,bg=#313244,bold] #S #[fg=#313244,bg=default,nobold] "

# tmux >= 3.8 underlines the current window and reverses activity/bell by default,
# which breaks the capsule shapes
setw -g window-status-style default
setw -g window-status-current-style default
setw -g window-status-last-style default
setw -g window-status-activity-style default
setw -g window-status-bell-style default
setw -g window-status-separator " "
setw -g window-status-format "#[fg=#6c7086,bg=default]#[fg=#11111b,bg=#6c7086]#I #[fg=#a6adc8,bg=#313244] #W #[fg=#313244,bg=default,nobold]"
setw -g window-status-current-format "#[fg=#fab387,bg=default]#[fg=#11111b,bg=#fab387]#I #[fg=#cdd6f4,bg=#313244,bold] #W #[fg=#313244,bg=default,nobold]"

set -g status-right "#{?window_zoomed_flag,#{E:@cap_zoom},}#{?pane_synchronized,#{E:@cap_sync},}#{?pane_in_mode,#{E:@cap_copy},}\
#[fg=#cba6f7,bg=default]#[fg=#11111b,bg=#cba6f7] #[fg=#cdd6f4,bg=#313244] #{b:pane_current_path} #[fg=#313244,bg=default,nobold] \
#[fg=#b4befe,bg=default]#[fg=#11111b,bg=#b4befe]󰒋 #[fg=#cdd6f4,bg=#313244] #h #[fg=#313244,bg=default,nobold]"

set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"
set -g message-style "bg=#313244,fg=#cdd6f4"
set -g message-command-style "bg=#313244,fg=#cdd6f4"
setw -g mode-style "bg=#45475a,fg=#cdd6f4"
set -g popup-border-lines rounded
set -g popup-border-style "fg=#89b4fa"
