# Catppuccin Mocha status line, hand-written (no plugin manager).
# Palette: https://catppuccin.com/palette
#   crust #11111b  mantle #181825  surface0 #313244  surface1 #45475a
#   overlay0 #6c7086  subtext0 #a6adc8  text #cdd6f4
#   red #f38ba8  peach #fab387  blue #89b4fa  mauve #cba6f7

set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#181825,fg=#cdd6f4"
set -g status-left-length 40
set -g status-right-length 60

# Session name; turns red while the prefix is pending
set -g status-left "#[bg=#{?client_prefix,#f38ba8,#89b4fa},fg=#11111b,bold]  #S #[default] "
set -g status-right "#[fg=#fab387]#{?window_zoomed_flag,󰁌 zoom  ,}#[fg=#a6adc8] #{b:pane_current_path}  #[fg=#cba6f7]󰒋 #h "

setw -g window-status-separator ""
setw -g window-status-format "#[fg=#6c7086] #I #W "
setw -g window-status-current-format "#[bg=#313244,fg=#fab387,bold] #I #W "

set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"
set -g message-style "bg=#313244,fg=#cdd6f4"
set -g message-command-style "bg=#313244,fg=#cdd6f4"
setw -g mode-style "bg=#45475a,fg=#cdd6f4"
set -g popup-border-style "fg=#89b4fa"
