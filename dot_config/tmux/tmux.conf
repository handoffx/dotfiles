# tmux >= 3.7 (developed against 3.8)

# --- Prefix -------------------------------------------------------------------
set -g prefix C-a
unbind C-b
bind C-a send-prefix          # C-a C-a sends a literal C-a (nvim increment, shell line start)

# --- Terminal capabilities ----------------------------------------------------
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm*:RGB:usstyle:hyperlinks:sync:clipboard:focus:extkeys:ccolour:cstyle:strikethrough:overline"
set -as terminal-features ",wezterm:RGB:usstyle:hyperlinks:sync:clipboard:focus:extkeys:ccolour:cstyle:strikethrough:overline"
set -g extended-keys on
set -g extended-keys-format csi-u
set -g escape-time 10
set -g focus-events on
set -g set-clipboard on
set -g allow-passthrough on   # images (kitty graphics) from nvim

# --- General ------------------------------------------------------------------
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off  # switch to another session instead of detaching
setw -g mode-keys vi
set -g status-keys emacs

bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# --- Windows and splits (keep cwd) --------------------------------------------
bind c new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind C-l send-keys C-l        # C-l is taken by navigation; prefix C-l clears the shell

# --- smart-splits.nvim (backend-tmux), at_edge = 'stop' -----------------------
# Pass keys through when the pane runs nvim (@pane-is-vim is set by the nvim
# backend) or fzf; otherwise move between tmux panes and stop at the edge.
# Keep at_edge in sync with lazyx-nvim.
is_app='#{||:#{@pane-is-vim},#{m:*fzf*,#{pane_current_command}}}'
bind -n C-h if -F "$is_app" { send-keys C-h } { if -F '#{pane_at_left}'   '' 'select-pane -L' }
bind -n C-j if -F "$is_app" { send-keys C-j } { if -F '#{pane_at_bottom}' '' 'select-pane -D' }
bind -n C-k if -F "$is_app" { send-keys C-k } { if -F '#{pane_at_top}'    '' 'select-pane -U' }
bind -n C-l if -F "$is_app" { send-keys C-l } { if -F '#{pane_at_right}'  '' 'select-pane -R' }

bind -n M-h if -F '#{@pane-is-vim}' { send-keys M-h } { resize-pane -L 3 }
bind -n M-j if -F '#{@pane-is-vim}' { send-keys M-j } { resize-pane -D 3 }
bind -n M-k if -F '#{@pane-is-vim}' { send-keys M-k } { resize-pane -U 3 }
bind -n M-l if -F '#{@pane-is-vim}' { send-keys M-l } { resize-pane -R 3 }

# --- Copy mode ----------------------------------------------------------------
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel   # OSC 52 via set-clipboard
bind -T copy-mode-vi C-h if -F '#{pane_at_left}'   '' 'select-pane -L'
bind -T copy-mode-vi C-j if -F '#{pane_at_bottom}' '' 'select-pane -D'
bind -T copy-mode-vi C-k if -F '#{pane_at_top}'    '' 'select-pane -U'
bind -T copy-mode-vi C-l if -F '#{pane_at_right}'  '' 'select-pane -R'

# --- Theme --------------------------------------------------------------------
source-file ~/.config/tmux/catppuccin-mocha.conf
