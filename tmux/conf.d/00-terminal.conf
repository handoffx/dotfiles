# 00-terminal.conf — 终端能力声明（server 作用域）

set -s default-terminal "tmux-256color"

# 追加型选项：先 -u 重置为默认值，保证重复 source 不会叠加
set -su terminal-features
# GNOME Terminal (VTE) 支持真彩色、下划线样式、光标样式，但不支持 OSC 52 剪贴板
set -sa terminal-features ",xterm-256color:RGB:usstyle:cstyle:focus"

set -s escape-time 10      # nvim 中按 Esc 不卡顿
set -s focus-events on     # 让 nvim 的 autoread / FocusGained 生效
set -s extended-keys on    # 允许 nvim 区分 C-i 与 Tab 等组合键
