# 10-options.conf — 会话 / 窗口行为（显式写出关心的值，不依赖默认值）

set -g mouse on
set -g history-limit 50000
set -g base-index 1             # 窗口从 1 开始编号，对应键盘布局
set -gw pane-base-index 1
set -g renumber-windows on      # 关闭窗口后重新编号，避免出现空号
set -g set-titles on
set -g set-titles-string "#S:#W — #{pane_title}"
set -g display-time 2000
set -gw aggressive-resize on    # 多客户端连接时按当前可见窗口调整大小
set -g editor nvim
