# 20-keys.conf — prefix 与按键绑定

# Prefix: C-a（连按两次 C-a 把 C-a 发给 shell，用于跳到行首）
set -g prefix C-a
unbind C-b
bind C-a send-prefix

set -g status-keys emacs        # 命令提示符里保留 readline 风格的编辑键

# 不用 #{config_files}：不带 -f 启动时它是所有候选路径用逗号拼成的一串（含不存在的），
# source-file 会把整串当成一个文件名。改为加载时记下入口文件的路径。
set -gF @tmux_conf "#{d:current_file}/../tmux.conf"
bind r source-file -F "#{@tmux_conf}" \; display "配置已重载"

# 分屏和新建窗口时继承当前目录；| 和 - 的形状对应分割方向
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# 调整 pane 大小（-r 允许按一次 prefix 后连续按）
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ── 与 nvim 无缝切换 pane：C-h/j/k/l ─────────────────────────
# 当前 pane 是 nvim 时把按键原样转发给 nvim（由 nvim 侧决定是否跳出），
# 否则直接由 tmux 切换 pane。
# nvim 侧由 AstroNvim 自带的 smart-splits.nvim 负责：到达 nvim 窗口边缘时调用 tmux select-pane。
# 局限：通过 ssh 在远端运行的 nvim 无法识别（前台进程是 ssh）。
%hidden is_vim='#{m/r:^n?vim$,#{pane_current_command}}'
bind -n C-h if -F "$is_vim" 'send-keys C-h' 'select-pane -L'
bind -n C-j if -F "$is_vim" 'send-keys C-j' 'select-pane -D'
bind -n C-k if -F "$is_vim" 'send-keys C-k' 'select-pane -U'
bind -n C-l if -F "$is_vim" 'send-keys C-l' 'select-pane -R'

# prefix + C-l 保留“清屏”功能（C-l 已被导航占用）
bind C-l send-keys C-l
