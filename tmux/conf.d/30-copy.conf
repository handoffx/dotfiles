# 30-copy.conf — vi 风格 copy mode + 系统剪贴板（macOS: pbcopy / Linux: wl-copy）

set -gw mode-keys vi

# 不走终端剪贴板（OSC 52）：Linux 上的 VTE 不支持，统一交给系统命令
set -s set-clipboard off
# tmux 没有表示操作系统的 format，只能用 shell 判断；不加 -b，加载配置时同步执行
if 'test "$(uname)" = Darwin' \
    'set -s copy-command "pbcopy"' \
    'set -s copy-command "wl-copy"'

bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel
bind p paste-buffer -p          # -p: 支持 bracketed paste 的程序不会把粘贴内容逐字当命令执行
