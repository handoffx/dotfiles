# 40-theme.conf — Catppuccin 主题（v2.3.2，手动安装在 plugins/ 下，不用 TPM）
# 升级：cd plugins/catppuccin/tmux && git fetch --tags && git checkout <新 tag>

# 主题内部用 set -o（仅在未设置时生效）定义默认值，
# 所以自定义的 @catppuccin_* 选项必须写在 source 之前。
set -g @catppuccin_flavor "mocha"            # latte / frappe / macchiato / mocha
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_text " #W"         # 默认是 #T（pane 标题），改成窗口名
set -g @catppuccin_window_current_text " #W"
set -g @catppuccin_window_flags "icon"       # zoom / mark / bell 等状态用图标表示

# 等价于 run catppuccin.tmux，但不经过 bash
source-file -F "#{d:current_file}/../plugins/catppuccin/tmux/catppuccin_options_tmux.conf"
source-file -F "#{d:current_file}/../plugins/catppuccin/tmux/catppuccin_tmux.conf"
